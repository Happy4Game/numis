; PROJECT RESILIENCE-ALPHA — objet connecté de signalisation (consigne additionnelle 1)
; IDE imposé : JetBrains CLion + PlatformIO. Ouvrir CLion -> "Open" ce dossier.
; Carte : NodeMCU v2 (ESP8266). Adapter `board` si votre module diffère (ex: d1_mini).

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
