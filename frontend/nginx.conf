server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA : toutes les routes -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy vers les services INTERNES : le navigateur ne parle qu'au frontend,
    # les services (ml, remédiation, auth, API) restent non exposés au réseau pédagogique.
    location /api/ml/ {
        proxy_pass http://ml-detector:8000/;
    }
    location /api/remediation/ {
        proxy_pass http://remediation-engine:8000/;
    }
    location /api/auth/ {
        proxy_pass http://auth:8000/;
    }
    location /api/payment/ {
        proxy_pass http://waf:8080/;   # passe par le WAF, comme un vrai client
    }
}
