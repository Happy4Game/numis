server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Résolveur DNS interne de Docker : on résout les upstreams À LA REQUÊTE (via une
    # variable), pas au démarrage. nginx démarre donc même si un service n'est pas encore
    # prêt, et re-résout l'IP quand un conteneur est redémarré (utile pour la remédiation).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA : toutes les routes -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ml/ {
        set $up_ml ml-detector;
        rewrite ^/api/ml/(.*)$ /$1 break;
        proxy_pass http://$up_ml:8000;
    }
    location /api/remediation/ {
        set $up_rem remediation-engine;
        rewrite ^/api/remediation/(.*)$ /$1 break;
        proxy_pass http://$up_rem:8000;
    }
    location /api/auth/ {
        set $up_auth auth;
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass http://$up_auth:8000;
    }
    location /api/payment/ {
        set $up_waf waf;
        rewrite ^/api/payment/(.*)$ /$1 break;
        proxy_pass http://$up_waf:8080;   # passe par le WAF, comme un vrai client
    }
}
