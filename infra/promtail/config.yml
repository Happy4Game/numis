server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Logs de TOUS les conteneurs (découverte via le socket Docker, lecture seule).
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
    pipeline_stages:
      # Nos services loguent en JSON : on extrait le niveau pour filtrer dans Grafana.
      - json:
          expressions:
            level: level
            service: service
      - labels:
          level:
          service:

  # 2. Journal d'audit du WAF (ModSecurity) — pour l'investigation SOC.
  - job_name: modsec
    static_configs:
      - targets: [localhost]
        labels:
          job: modsec
          __path__: /var/log/modsec/*.log
